    on_failure: Preserve error/failure and route correction; do not mark completed.
  retry_rule: Read prior execution and idempotency key; verify actual state before retrying a mutation. Never
    retry a denied/expired authority as though approval existed.
  review_triggers:
  - changed inputs/version or permissions
  - new contradictory evidence
  - review/expiry reached
