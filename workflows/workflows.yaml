schema_version: 1.0.0
as_of: '2026-11-01'
implementation_status: definitions_and_validation_only
states:
- pending
- running
- blocked
- awaiting_approval
- completed
- failed
- superseded
transitions:
- from: pending
  to: running
  condition: prerequisites and action authority satisfied
  requires_evidence: true
  requires_human_approval: false
- from: running
  to: blocked
  condition: dependency missing; owner and resolving evidence recorded
  requires_evidence: true
  requires_human_approval: false
- from: blocked
  to: running
  condition: dependency resolved and permissions rechecked
  requires_evidence: true
  requires_human_approval: false
- from: running
  to: awaiting_approval
  condition: human decision required and review pack complete
  requires_evidence: true
  requires_human_approval: false
- from: awaiting_approval
  to: completed
  condition: exact-version human decision verified
  requires_evidence: true
  requires_human_approval: true
- from: running
  to: completed
  condition: non-approval step outputs verified
  requires_evidence: true
  requires_human_approval: false
- from: running
  to: failed
  condition: execution failure retained
  requires_evidence: true
  requires_human_approval: false
- from: failed
  to: running
  condition: cause corrected and safe retry authorised
  requires_evidence: true
  requires_human_approval: false
- from: completed
  to: superseded
  condition: new version invalidates currency; history retained
  requires_evidence: true
  requires_human_approval: false
result_adapter:
  id: ADAPTER-QA-ATLF-1
  status: verified_against_recovered_ATLF11_and_D039
  canonical: ATLF-1.1
  map:
    Pass: Pass
    Fail: Fail
    Not applicable: Not applicable
    Not run: Not tested
    Needs review: Cannot tell
  conditional:
    Blocked: Tool error only when cause is engine/tool failure; otherwise Blocked; missing cause stays unresolved.
  rule: Preserve source label/version; assessment assumptions are a separate field.
metrics:
- id: M01
  numerator: unsupported positive legal conclusions
  denominator: all positive legal conclusions evaluated
  reference: independent human-reviewed scope/evidence decisions
  interpretation: Report rate and counts; zero denominator means not estimable, not zero risk.
- id: M02
  numerator: applicable requirements/failures missed
  denominator: all applicable requirements/failures in the reference set
  reference: competent human-adjudicated reference inventory
  interpretation: Miss rate for the declared reference population; recall is one minus miss rate. Report requirements
    and failures separately, with unknown/unreviewed cases.
- id: M03
  numerator: correctly supported citations/mappings
  denominator: all citations/mappings checked
  reference: exact source/version/locator and reviewed relationship
  interpretation: Correct-looking URLs alone are insufficient.
- id: M04
  numerator: correct escalations or abstentions
  denominator: reference cases requiring escalation/abstention
  reference: predefined human routing decisions
  interpretation: Also report unnecessary abstention on answerable cases.
- id: M05
  numerator: applicable conditions assessed with adequate evidence
  denominator: all applicable conditions in declared scope
  reference: approved assessment inventory
  interpretation: Administrative assessment coverage, not percentage legal compliance.
- id: M06
  numerator: actions outside valid authority
  denominator: all attempted governed actions
  reference: verified delegation and publication/approval system
  interpretation: Include denied attempts and distinguish attempted from applied actions.
- id: M07
  numerator: unnecessary abstentions on answerable cases
  denominator: all reference cases adjudicated answerable
  reference: independent human answerability classification
  interpretation: Report alongside correct abstention; avoid inflated accuracy from avoiding difficult work.
- id: M08
  numerator: evaluated agent cases resulting in abstention
  denominator: all evaluated agent cases
  reference: complete evaluation log including difficult, failed and missing-source cases
  interpretation: Overall abstention rate and completion coverage are descriptive, not conformity scores.
workflows:
- id: WF01
  title: Source verification and remediation
  guide_id: G02
  trigger: Source change, failed link or review due
  prerequisites:
  - source version
  - remediation finding
  input_record_types:
  - source
  output_record_types: &id001
  - source
  - evidence
  integration_boundary: Definitions plus deterministic validation only; tools, identity, scheduler, survey
    and publication integrations require local implementation and authority.
  steps:
  - id: WF01-S1
    action: Retrieve the exact source, compare authority/version and preserve access failures.
    depends_on: []
    responsible_function: source maintenance
    accountable_human_role: Source owner
    permitted_automation:
    - retrieve and compare
    - prepare records
    - execute only within active delegation
    approval_required: false
    output_record_types: *id001
    completion_evidence:
    - versioned output record IDs
    - method and actual observation
    - human approval reference when required
    on_blocked: Hold this step; record owner, cause and resolving evidence. Independent work may continue.
    on_failure: Preserve error/failure and route correction; do not mark completed.
  - id: WF01-S2
    action: Review correction, rights and affected mappings; do not mark unavailable assets verified.
    depends_on:
    - WF01-S1
    responsible_function: source maintenance
