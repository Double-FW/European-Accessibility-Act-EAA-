schema_version: 1.0.0
purpose: Instantiation instructions; none of these declarations is an approved record.
common:
  required_fields:
  - id
  - kind
  - schema_version
  - version
  - status
  - scope
  - source_ids
  - owner
  - created_on
  - limitations
  - relationships
  - evidence_refs
  - synthetic
  - review_date
  - data
  status: draft
  synthetic: false
  scope_fields:
  - subject
  - release
  - territories
  - channels
  rule: Supply real facts; never replace a missing fact with a fabricated approval.
templates:
- kind: source
  required_data_fields:
  - authority_type
  - source_version
  - location
  - source_status
  - verified_on
  - reviewed_scope
  - rights
  missing_input_action: Record the gap and block only the dependent decision.
  schema_pointer: ../records/record.schema.json#/oneOf/0
